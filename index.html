/* Cloud extension: login and notifications */
body:not(.cloud-ready) .app,body:not(.cloud-ready) .mobile-bar{display:none!important}
body.cloud-ready #authRoot{display:none!important}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top right,#e8ecff 0%,#f4f6fa 44%,#eaf0f8 100%)}
.auth-card{width:min(100%,460px);background:white;border-radius:25px;box-shadow:0 21px 70px #1c2e5530;padding:34px 31px;border:1px solid #e8edf6}
.auth-brand{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:7px;margin-bottom:23px}
.auth-brand .mark{width:57px;height:57px;border-radius:18px;color:white;display:grid;place-items:center;font-size:27px}
.auth-brand h1{font-size:23px;margin:0}.auth-brand p{margin:0;color:var(--muted);font-size:12px}
.auth-tabs{display:flex;background:#f0f3fa;border-radius:12px;padding:4px;gap:4px;margin:17px 0}
.auth-tabs button{flex:1;padding:10px 5px;border:0;background:transparent;border-radius:9px;color:#5f6d83;font-weight:700}
.auth-tabs button.active{background:white;color:#5265dd;box-shadow:0 2px 11px #10234c14}
.auth-form{display:grid;gap:14px}.auth-form label{display:grid;gap:6px;color:#41516b;font-weight:700;font-size:12px}
.auth-form input{border:1px solid #dfe5ef;border-radius:11px;padding:12px 14px;font-size:14px;background:#fff;color:#17233b;direction:ltr;text-align:left;width:100%}
.auth-form input:focus{border-color:#7383eb;box-shadow:0 0 0 3px #5265dd18}
.auth-form .btn{width:100%;padding:13px;margin-top:4px}
.auth-message{padding:12px 13px;background:#f0f5ff;border:1px solid #dbe7ff;border-radius:11px;font-size:12px;line-height:1.9;color:#344b76;margin:12px 0}
.auth-message.error{background:#fff1f3;border-color:#ffdee4;color:#a12b44}
.auth-help{font-size:11px;color:#7c899e;text-align:center;line-height:1.9;margin-top:17px}
.auth-link{background:none;border:0;color:#4f61cc;font-weight:700;font-size:12px;padding:8px}
.auth-spinner{width:26px;height:26px;border:3px solid #d9def5;border-top-color:#5265dd;border-radius:50%;animation:spin .9s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud-sync-button{font-size:10px!important;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.cloud-sync-button[data-state="saving"]{color:#a3792d}.cloud-sync-button[data-state="error"]{color:#c23b51;border-color:#ffd0d8}
.cloud-logout-button{font-size:11px!important}
@media(max-width:760px){.auth-card{padding:26px 20px}.cloud-sync-button{max-width:92px;font-size:9px!important}.cloud-logout-button{padding:7px 10px!important}}
@media(max-width:590px){
  .topbar{padding:0 10px;gap:4px}.topbar .top-actions{gap:4px}
  .topbar .pageheading{max-width:77px;overflow:hidden;text-overflow:ellipsis}
  .topbar .menu-btn{width:32px;height:34px}
  .topbar .period-control{padding:5px 3px;gap:0}
  .topbar .period-control>span{display:none}
  .topbar .period-control input{width:83px;max-width:83px!important;font-size:10px}
  .cloud-sync-button,.cloud-logout-button{font-size:0!important;width:30px;min-width:30px;height:33px;padding:0!important;flex-shrink:0}
  .cloud-sync-button::after{content:'◌';font-size:17px}.cloud-sync-button[data-state='ok']::after{content:'✓'}.cloud-sync-button[data-state='error']::after,.cloud-sync-button[data-state='conflict']::after{content:'⚠'}
  .cloud-logout-button::after{content:'⇦';font-size:17px}
}
@media(max-width:370px){.topbar .pageheading{max-width:51px}.topbar .period-control input{width:71px;max-width:71px!important}.topbar .top-actions{gap:3px}}

<div class="app" id="financeApp">

  <div class="main">
    <header class="topbar"><div style="display:flex;gap:11px;align-items:center"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><div><h2 class="pageheading" id="pageTitle">Dashboard</h2><p class="pagehint" id="pageHint">Your finances at a glance</p></div></div><div class="top-actions"><button class="btn ghost sm cloud-sync-button" id="syncButton" data-cloud-action="sync" title="Sync status">◌ Sync</button><label class="period-control"><span aria-hidden="true">▦</span><input type="month" id="periodPicker" aria-label="Select month" /></label><button class="btn primary" data-action="openTx" data-type="expense" aria-label="Add transaction"><span style="font-size:17px;line-height:1">+</span><span class="add-text">Add transaction</span></button><button class="btn ghost sm cloud-logout-button" data-cloud-action="logout" title="Sign out">Sign out</button></div></header>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const STORAGE_KEY='mizan_finance_egypt_v1';
const CATEGORY_COLORS=['#5265dd','#15a879','#8c6dd8','#e6a64b','#dc7999','#6da3d0','#3aaec0','#8d9bb0','#f07d5d','#9d83c6','#4aa887','#d39448'];
// Existing category IDs are unchanged to preserve transactions and budgets.
const CAT_NAMES=['Home','Charity','Projects','Savings','Personal expenses','Emergency fund','Education','Investments','Entertainment','Food','Transport','Healthcare'];
const KIND_NAMES={cash:'Cash',bank:'Bank',wallet:'E-wallet',savings:'Savings',investment:'Investment',other:'Other'};
const NAV=[['dashboard','Dashboard','dashboard'],['transactions','Transactions','list'],['allocations','Money envelopes','coins'],['budgets','Budgets','sliders'],['recurring','Recurring payments','arrow'],['debts','Debts & loans','wallet'],['accounts','Accounts','wallet'],['goals','Goals','target'],['reports','Reports','chart'],['settings','Settings','settings']];
const ICONS={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',sliders:'<path d="M4 7h16M4 17h16M8 4v6M16 14v6"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18M16 14h3"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',chart:'<path d="M4 20V4M4 20h16M8 15l4-4 3 2 5-7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13v-2l2-1-2-4-2 1-2-2V3H9v2L7 7 5 6 3 10l2 1v2l-2 1 2 4 2-1 2 2v2h6v-2l2-2 2 1 2-4z"/>',plus:'<path d="M12 5v14M5 12h14"/>',down:'<path d="M12 4v16m-6-6 6 6 6-6"/>',up:'<path d="M12 20V4m-6 6 6-6 6 6"/>',arrow:'<path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5m0-9h.01"/>',coins:'<circle cx="9" cy="13" r="7"/><path d="M12 8a7 7 0 1 1 0 10"/>',trash:'<path d="M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m-4 4 4-4 4 4M4 7V3h16v4"/>'};
function ico(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`}
function fresh(){return {version:1,schemaVersion:3,accounts:[{id:'cash',name:'Cash',kind:'cash',opening:0},{id:'bank',name:'Bank account',kind:'bank',opening:0},{id:'wallet',name:'E-wallet',kind:'wallet',opening:0},{id:'saving',name:'Savings account',kind:'savings',opening:0}],categories:CAT_NAMES.map((name,i)=>({id:'cat'+i,name,color:CATEGORY_COLORS[i]})),transactions:[],budgets:{},allocations:{},goals:[],recurring:[],debts:[],projects:[]}}
function safeLoad(){try{const s=localStorage.getItem(STORAGE_KEY);if(!s)return fresh();const d=JSON.parse(s);return validData(d)?d:fresh()}catch(e){return fresh()}}
let data=fresh();
let page='dashboard',selectedMonth=localMonth(), txFilters={type:'all',query:'',category:'all',account:'all'};
const moneyFmt=new Intl.NumberFormat('en-EG',{minimumFractionDigits:0,maximumFractionDigits:2});
function money(n){return moneyFmt.format(Number(n)||0)+' EGP'}
function moneyN(n){return moneyFmt.format(Number(n)||0)}
function id(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function localDate(d=new Date()){const yy=d.getFullYear(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${yy}-${mm}-${dd}`}
function localMonth(){return localDate().slice(0,7)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clamp(n,l=0,h=100){return Math.min(h,Math.max(l,n))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function goodAmount(v){const n=Number(v);return Number.isFinite(n)&&n>0&&n<=1000000000000}
function safeSave(){return typeof window.mizanCloudSafeSave==='function'?window.mizanCloudSafeSave():false}
function validData(d){if(!d||d.version!==1||!Array.isArray(d.accounts)||!Array.isArray(d.categories)||!Array.isArray(d.transactions)||!Array.isArray(d.goals)||!d.budgets||typeof d.budgets!=='object'||Array.isArray(d.budgets))return false;
 if(d.accounts.length>2000||d.categories.length>2000||d.transactions.length>500000||d.goals.length>10000||((d.recurring||[]).length>10000)||((d.debts||[]).length>10000))return false;
 if(!d.accounts.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&x.name.length<250&&Number.isFinite(Number(x.opening))&&typeof x.kind==='string'))return false;
 if(!d.categories.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&x.name.length<250&&/^#[0-9a-f]{6}$/i.test(x.color)))return false;
 if(!d.transactions.every(x=>typeof x.id==='string'&&['income','expense','transfer','loan_out','loan_in','loan_repaid','loan_paid'].includes(x.type)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&goodAmount(x.amount)&&typeof x.accountId==='string'&&(!x.description||typeof x.description==='string')&&(!x.categoryId||typeof x.categoryId==='string')&&(!x.toAccountId||typeof x.toAccountId==='string')&&(!x.goalId||typeof x.goalId==='string')&&(!x.splits||(Array.isArray(x.splits)&&x.splits.length<=100&&x.splits.every(y=>typeof y.categoryId==='string'&&goodAmount(y.amount))&&(x.splits.length===0||Math.abs(x.splits.reduce((v,y)=>v+Math.round(num(y.amount)*100),0)-Math.round(num(x.amount)*100))<=1)))))return false;
 if(!d.goals.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&typeof x.accountId==='string'&&Number.isFinite(Number(x.target))&&Number(x.target)>0&&Number.isFinite(Number(x.starting))))return false;
 if(![d.budgets,d.allocations||{}].every(dict=>dict&&typeof dict==='object'&&!Array.isArray(dict)&&Object.entries(dict).every(([k,v])=>/^\d{4}-\d{2}$/.test(k)&&v&&typeof v==='object'&&!Array.isArray(v)&&Object.values(v).every(n=>Number.isFinite(Number(n))&&Number(n)>=0&&Number(n)<=1e12))))return false;
 const aIds=new Set(d.accounts.map(x=>x.id)),cIds=new Set(d.categories.map(x=>x.id)),gIds=new Set(d.goals.map(x=>x.id));
 if(aIds.size!==d.accounts.length||cIds.size!==d.categories.length||gIds.size!==d.goals.length)return false;
 if(d.transactions.some(t=>!aIds.has(t.accountId)||(t.type==='transfer'&&(!aIds.has(t.toAccountId)||t.toAccountId===t.accountId))||(t.type==='expense'&&(!cIds.has(t.categoryId)||t.splits?.some(s=>!cIds.has(s.categoryId))))||(t.goalId&&!gIds.has(t.goalId))))return false;
 if(d.goals.some(g=>!aIds.has(g.accountId)))return false; if((d.recurring||[]).some(r=>typeof r.id!=='string'||typeof r.name!=='string'||r.name.length>250||!['income','expense'].includes(r.type)||!['weekly','monthly'].includes(r.frequency)||!goodAmount(r.amount)||!aIds.has(r.accountId)||(r.type==='expense'&&!cIds.has(r.categoryId))||!safeDate(r.nextDue)))return false; if((d.debts||[]).some(x=>typeof x.id!=='string'||typeof x.name!=='string'||x.name.length>250||!['lent','borrowed'].includes(x.direction)||!goodAmount(x.principal)||!aIds.has(x.accountId)||!safeDate(x.date)||(x.dueDate&&!safeDate(x.dueDate))||!Array.isArray(x.payments)||x.payments.some(p=>!goodAmount(p.amount)||!aIds.has(p.accountId)||!safeDate(p.date))||x.payments.reduce((a,p)=>a+num(p.amount),0)>num(x.principal)+.001))return false;
 return true;
}
function upgradeData(d){const out=structuredClone(d);out.schemaVersion=3;out.allocations=out.allocations||{};out.recurring=out.recurring||[];out.debts=out.debts||[];out.projects=out.projects||[];
  // Migrate only untouched built-in Arabic names; keep every custom name as entered.
  const oldCats=["\u0627\u0644\u0628\u064a\u062a","\u0627\u0644\u0635\u062f\u0642\u0629","\u0627\u0644\u0645\u0634\u0627\u0631\u064a\u0639","\u0627\u0644\u0627\u062f\u062e\u0627\u0631","\u0627\u0644\u0645\u0635\u0627\u0631\u064a\u0641 \u0627\u0644\u0634\u062e\u0635\u064a\u0629","\u0627\u0644\u0637\u0648\u0627\u0631\u0626","\u0627\u0644\u062a\u0639\u0644\u064a\u0645","\u0627\u0644\u0627\u0633\u062a\u062b\u0645\u0627\u0631","\u0627\u0644\u062a\u0631\u0641\u064a\u0647","\u0627\u0644\u0623\u0643\u0644","\u0627\u0644\u0645\u0648\u0627\u0635\u0644\u0627\u062a","\u0627\u0644\u0635\u062d\u0629"];
  for(let i=0;i<oldCats.length;i++){const item=out.categories.find(c=>c.id==='cat'+i);if(item?.name===oldCats[i])item.name=CAT_NAMES[i];}
  const oldAccounts={"cash":"\u0643\u0627\u0634","bank":"\u0627\u0644\u062d\u0633\u0627\u0628 \u0627\u0644\u0628\u0646\u0643\u064a","wallet":"\u0645\u062d\u0641\u0638\u0629 \u0625\u0644\u0643\u062a\u0631\u0648\u0646\u064a\u0629","saving":"\u062d\u0633\u0627\u0628 \u0627\u062f\u062e\u0627\u0631"};
  for(const a of out.accounts){if(oldAccounts[a.id]===a.name){const modern={cash:'Cash',bank:'Bank account',wallet:'E-wallet',saving:'Savings account'};a.name=modern[a.id];}}
  return out}

function account(id){return data.accounts.find(x=>x.id===id)}
function category(id){return data.categories.find(x=>x.id===id)}
function goal(id){return data.goals.find(x=>x.id===id)}
function accountBalance(accountId){const a=account(accountId);let result=num(a?.opening);for(const t of data.transactions){if(['income','loan_in','loan_repaid'].includes(t.type)&&t.accountId===accountId)result+=num(t.amount);if(['expense','loan_out','loan_paid'].includes(t.type)&&t.accountId===accountId)result-=num(t.amount);if(t.type==='transfer'){if(t.accountId===accountId)result-=num(t.amount);if(t.toAccountId===accountId)result+=num(t.amount)}}return Math.round(result*100)/100}
function allBalance(){return data.accounts.reduce((sum,a)=>sum+accountBalance(a.id),0)}
function monthlyTransactions(month=selectedMonth){return data.transactions.filter(t=>t.date.startsWith(month))}
function totals(month=selectedMonth){const t=monthlyTransactions(month);return {income:t.filter(x=>x.type==='income').reduce((s,x)=>s+num(x.amount),0),expense:t.filter(x=>x.type==='expense').reduce((s,x)=>s+num(x.amount),0),transfers:t.filter(x=>x.type==='transfer').reduce((s,x)=>s+num(x.amount),0)}}
function catExpenses(month=selectedMonth){const m={};for(const t of monthlyTransactions(month)){if(t.type==='expense'){if(Array.isArray(t.splits)&&t.splits.length>1){for(const x of t.splits)m[x.categoryId]=(m[x.categoryId]||0)+num(x.amount)}else m[t.categoryId]=(m[t.categoryId]||0)+num(t.amount)}}return m}
function goalProgress(g){let sum=num(g.starting);for(const t of data.transactions){if(t.type==='transfer'&&t.goalId===g.id){if(t.toAccountId===g.accountId)sum+=num(t.amount);else if(t.accountId===g.accountId)sum-=num(t.amount)}}return sum}
function monthLabel(m){return new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function prevMonth(m,steps=1){const d=new Date(+m.slice(0,4),+m.slice(5,7)-1-steps,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function dateLabel(d){const [y,m,da]=d.split('-');return `${da}/${m}/${y}`}
function categoryIcon(c){return `<span class="dot" style="background:${esc(c?.color||'#9eabc0')}"></span>`}
function options(arr,selected,placeholder){let out=placeholder?`<option value="">${esc(placeholder)}</option>`:'';return out+arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function toast(message,type='ok'){const el=document.createElement('div');el.className='toast'+(type==='error'?' error':'');el.textContent=message;document.getElementById('toastHolder').append(el);setTimeout(()=>el.remove(),3800)}
function actNav(p){page=p;txFilters={type:'all',query:'',category:'all',account:'all'};closeDrawer();render();window.scrollTo({top:0,behavior:'instant'})}
function drawNav(){document.getElementById('sideNav').innerHTML=NAV.map(([p,l,icon])=>`<button type="button" class="nav-item ${p===page?'active':''}" data-nav="${p}">${ico(icon)}<span>${l}</span></button>`).join('');const mobile=[NAV[0],NAV[1],NAV[2],NAV[3],NAV[6]];document.getElementById('mobileNav').innerHTML=mobile.map(([p,l,icon])=>`<button type="button" class="mobile-nav ${p===page?'active':''}" data-nav="${p}">${ico(icon)}<span>${l}</span></button>`).join('')}
function closeDrawer(){document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.add('hidden')}
function toggleDrawer(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('shade').classList.toggle('hidden')}
function render(){const info={dashboard:['Dashboard','Your finances at a glance'],transactions:['Transactions','Track income, spending and transfers'],allocations:['Money envelopes','Allocate your money to your priorities'],budgets:['Budgets','Set spending limits by category'],recurring:['Recurring payments','Manage due dates and confirm payments'],debts:['Debts & loans','Track money owed without counting it as income'],accounts:['Accounts & wallets','Where your money is held'],goals:['Savings goals','Track progress toward your goals'],reports:['Analytics & reports','Understand your money habits'],settings:['Settings & data','Manage categories and backups']}[page]||['Mizan',''];document.getElementById('pageTitle').textContent=info[0];document.getElementById('pageHint').textContent=info[1];document.getElementById('periodPicker').value=selectedMonth;drawNav();document.getElementById('content').innerHTML=({dashboard:renderDashboard,transactions:renderTransactions,allocations:renderAllocations,budgets:renderBudgets,recurring:renderRecurring,debts:renderDebts,accounts:renderAccounts,goals:renderGoals,reports:renderReports,settings:renderSettings}[page]||renderDashboard)();if(page==='dashboard')document.getElementById('content').insertAdjacentHTML('beforeend',dashboardExtras())}
function stat(title,val,icoName,color='blue',sub=''){const colors={blue:['#edf0ff','#5265dd'],green:['#e8f8f0','#16a47a'],red:['#fff0f2','#e25b6b'],amber:['#fff5e4','#d99521']};const c=colors[color];return `<article class="stat-card"><div class="stat-head"><span class="stat-title">${title}</span><div class="stat-icon" style="background:${c[0]};color:${c[1]}">${ico(icoName)}</div></div><div class="stat-value" title="${esc(val)}">${esc(val)}</div><div class="stat-sub">${sub}</div></article>`}
function barChart(){const months=Array.from({length:6},(_,i)=>prevMonth(selectedMonth,5-i));const entries=months.map(m=>({m,...totals(m)}));if(entries.every(e=>!e.income&&!e.expense))return `<div class="empty">${ico('chart',34)}<strong>No transactions in this period</strong><span>Your chart will appear once you add transactions</span></div>`;const peak=Math.max(1,...entries.flatMap(x=>[x.income,x.expense]));const W=620,H=230,base=186,top=23,scale=(base-top)/peak;let html=`<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Six-month income and expense chart">`;for(let i=0;i<4;i++){const y=base-i*(base-top)/3;html+=`<line x1="35" x2="610" y1="${y}" y2="${y}" stroke="#eff2f7"/><text x="28" y="${y+4}" text-anchor="end" font-size="10" fill="#9ca7b7">${esc(shortMoney(peak*i/3))}</text>`}entries.forEach((e,i)=>{const center=88+i*99,incH=e.income*scale,expH=e.expense*scale;html+=`<rect x="${center-24}" y="${base-incH}" width="20" height="${incH}" rx="5" fill="#5265dd"><title>Income ${monthLabel(e.m)}: ${money(e.income)}</title></rect><rect x="${center+3}" y="${base-expH}" width="20" height="${expH}" rx="5" fill="#34b39d"><title>Expenses ${monthLabel(e.m)}: ${money(e.expense)}</title></rect><text x="${center}" y="211" font-size="10" text-anchor="middle" fill="#75839b">${esc(new Date(+e.m.slice(0,4),+e.m.slice(5,7)-1,1).toLocaleDateString('en-GB',{month:'short'}))}</text>`});return html+'</svg><div class="chart-legend"><span><i class="dot" style="background:#5265dd"></i>Income</span><span><i class="dot" style="background:#34b39d"></i>Expenses</span></div>'}
function shortMoney(v){if(v>=1000000)return moneyN(v/1000000)+'M';if(v>=1000)return moneyN(v/1000)+'k';return moneyN(v)}
function donut(){const exp=catExpenses(),items=Object.entries(exp).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]),sum=items.reduce((s,x)=>s+x[1],0);if(!sum)return `<div class="empty">${ico('chart',34)}<strong>No expenses this month</strong><span>Add an expense to see where your money goes</span></div>`;let p=0;const gradient=items.map(([k,v])=>{const s=p;p+=v/sum*100;return `${category(k)?.color||'#999'} ${s}% ${p}%`}).join(',');let other=items.slice(5).reduce((s,x)=>s+x[1],0);const legends=items.slice(0,5).map(([k,v])=>({name:category(k)?.name||'Category',color:category(k)?.color||'#999',val:v}));if(other)legends.push({name:'Other',color:'#b4bdcc',val:other});return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${gradient})"><div class="donut-center"><span>Total spending</span><strong>${moneyN(sum)}</strong><span>EGP</span></div></div><div class="legend">${legends.map(x=>`<div class="legend-item"><span class="legend-name"><i class="dot" style="background:${x.color}"></i>${esc(x.name)}</span><strong>${Math.round(x.val/sum*100)}%</strong></div>`).join('')}</div></div>`}
function txName(t){const loan={loan_out:'Money lent',loan_in:'Money borrowed',loan_repaid:'Loan repayment received',loan_paid:'Loan repayment made'};if(loan[t.type])return t.description||loan[t.type];if(t.type==='transfer')return `Transfer to ${account(t.toAccountId)?.name||'Account'}`;return t.description||(t.type==='expense'?(category(t.categoryId)?.name||'Expense'):'Income')}
function typeLabel(t){return ({income:'Income',expense:'Expense',transfer:'Transfer',loan_out:'Lending',loan_in:'Borrowing',loan_repaid:'Loan repayment received',loan_paid:'Debt repayment'})[t.type]||'transaction'}
function transactionTable(t,limit){const rows=typeof limit==='number'?t.slice(0,limit):t;if(!rows.length)return `<div class="empty">${ico('list',34)}<strong>No transactions yet</strong><span>Add your first transaction to start tracking</span><button class="btn soft" data-action="openTx" data-type="expense">Add expense</button></div>`;return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Details</th><th>Date</th><th>Account</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead><tbody>${rows.map(t=>`<tr><td><div class="transaction-name">${esc(txName(t))}</div><div class="tx-note">${esc(typeLabel(t))}</div></td><td class="muted ltr">${dateLabel(t.date)}</td><td>${esc(account(t.accountId)?.name||'—')}${t.type==='transfer'?' ← '+esc(account(t.toAccountId)?.name||'—'):''}</td><td><span class="pill ${t.type==='income'?'green':t.type==='expense'?'red':'blue'}">${t.type==='expense'?(t.splits?.length>1?'Split: '+t.splits.length+' Categories':esc(category(t.categoryId)?.name||'—')):esc(typeLabel(t))}</span></td><td style="font-weight:bold" class="${['income','loan_in','loan_repaid'].includes(t.type)?'positive':['expense','loan_out','loan_paid'].includes(t.type)?'negative':''}"><span class="ltr">${['income','loan_in','loan_repaid'].includes(t.type)?'+':['expense','loan_out','loan_paid'].includes(t.type)?'−':''}${money(t.amount)}</span></td><td>${t.debtId?'<span class="muted small">Manage in Debts</span>':`<div class="row-actions"><button class="tiny-btn" data-action="editTx" data-id="${esc(t.id)}">Edit</button><button class="tiny-btn" data-action="deleteTx" data-id="${esc(t.id)}">Delete</button></div>`}</td></tr>`).join('')}</tbody></table></div>`}
function sortedTx(t){return [...t].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''))}
function budgetRow(c,month,editable=false){const v=num(data.budgets[month]?.[c.id]),spent=num(catExpenses(month)[c.id]),ratio=v?spent/v*100:0,fill=clamp(ratio),color=ratio>100?'#e25b6b':ratio>85?'#e4a53a':c.color;return `<div class="budget-row"><div class="head"><span>${categoryIcon(c)} <strong>${esc(c.name)}</strong></span><span>${v?money(spent)+' / '+money(v):money(spent)+' / No budget'} ${editable?`<button class="tiny-btn" data-action="setBudget" data-id="${esc(c.id)}">Set limit</button>`:''}</span></div><div class="budget-track"><div class="budget-fill" style="width:${fill}%;background:${color}"></div></div><div class="budget-caption"><span>${v?'Remaining: '+money(v-spent):'Set a category budget'}</span><span>${v?moneyN(ratio)+'%':'—'}</span></div></div>`}
function renderDashboard(){const t=totals(),net=t.income-t.expense,all=allBalance(),expenseMap=catExpenses();const ranked=Object.entries(expenseMap).sort((a,b)=>b[1]-a[1]);const top=ranked[0];const budgeted=data.categories.filter(c=>num(data.budgets[selectedMonth]?.[c.id])>0);return `<div class="top-alert">${ico('info',16)}<span>After signing in, your data syncs to your cloud account. Watch the sync status and export a JSON backup periodically.</span></div><div class="hero"><div><h2>Welcome to Mizan 👋</h2><p>Every pound has a purpose. Your financial overview for ${monthLabel(selectedMonth)}.</p></div><div class="actions"><button class="btn white" data-action="openTx" data-type="expense">${ico('plus')} Record expense</button></div></div><section class="stats">${stat('Monthly income',money(t.income),'down','green','Recorded income total')}${stat('Monthly expenses',money(t.expense),'up','red','Excludes internal transfers')}${stat('Surplus / deficit',money(net),'coins',net>=0?'blue':'red',net>=0?'Income minus expenses':'Expenses exceed income')}${stat('Total account balance',money(all),'wallet','amber','Includes opening balances')}</section><div class="grid-2"><section class="panel"><div class="panel-head"><div><h3>Income & spending activity</h3><div class="panel-sub">Last 6 months through ${monthLabel(selectedMonth)}</div></div></div>${barChart()}</section><section class="panel"><div class="panel-head"><div><h3>Spending by category</h3><div class="panel-sub">Share of monthly spending by category</div></div></div>${donut()}</section></div><div class="grid-equal"><section class="panel"><div class="panel-head"><div><h3>Budget tracking</h3><div class="panel-sub">Categories with a spending plan</div></div><button class="link-btn" data-nav="budgets">View all</button></div>${budgeted.length?budgeted.slice(0,5).map(c=>budgetRow(c,selectedMonth)).join(''):`<div class="empty">${ico('sliders',32)}<strong>No budgets set for this month</strong><span>Plan spending for your priority categories</span><button class="btn soft" data-nav="budgets">Set budgets</button></div>`}</section><section class="panel"><div class="panel-head"><div><h3>Smart insights</h3><div class="panel-sub">Actionable insights from your numbers</div></div></div>${top?`<div class="insight">Your largest spending category this month is <strong>${esc(category(top[0])?.name||'—')}</strong> totaling <strong>${money(top[1])}</strong>, representing <strong>${Math.round(top[1]/Math.max(t.expense,1)*100)}%</strong> of your spending.</div><div style="height:12px"></div><div class="insight">${net>=0?`Monthly surplus <strong>${money(net)}</strong>. Consider setting some aside for your goals.`:`Your monthly deficit is <strong>${money(-net)}</strong>. Review your largest expenses and budget limits.`}</div>`:`<div class="empty">${ico('info',32)}<strong>Ready when you are</strong><span>Insights appear here after you add transactions</span></div>`}</section></div><section class="panel"><div class="panel-head"><div><h3>Recent transactions</h3><div class="panel-sub">Transactions for ${monthLabel(selectedMonth)}</div></div><button class="link-btn" data-nav="transactions">All transactions</button></div>${transactionTable(sortedTx(monthlyTransactions()),5)}</section>`}
function renderTransactions(){let t=monthlyTransactions();if(txFilters.type!=='all')t=t.filter(x=>x.type===txFilters.type);if(txFilters.category!=='all')t=t.filter(x=>x.categoryId===txFilters.category||x.splits?.some(s=>s.categoryId===txFilters.category));if(txFilters.account!=='all')t=t.filter(x=>x.accountId===txFilters.account||x.toAccountId===txFilters.account);if(txFilters.query.trim()){const q=txFilters.query.trim().toLocaleLowerCase('en');t=t.filter(x=>(txName(x)+' '+(x.description||'')+' '+(category(x.categoryId)?.name||'')).toLocaleLowerCase('en').includes(q))}t=sortedTx(t);return `<div class="section-top"><div><h3 class="section-title">All transactions — ${monthLabel(selectedMonth)}</h3><div class="section-note">View and manage income, expenses, and transfers in one place</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn soft" data-action="openTx" data-type="income">${ico('plus')} Income</button><button class="btn primary" data-action="openTx" data-type="expense">${ico('plus')} Expense</button><button class="btn ghost" data-action="openTx" data-type="transfer">${ico('arrow')} Transfer</button></div></div><div class="filters"><input id="txSearch" class="search" placeholder="Search transactions..." value="${esc(txFilters.query)}" aria-label="Search"/><select id="txType" class="field-control filter-control"><option value="all">All types</option><option value="income" ${txFilters.type==='income'?'selected':''}>Income</option><option value="expense" ${txFilters.type==='expense'?'selected':''}>Expense</option><option value="transfer" ${txFilters.type==='transfer'?'selected':''}>Transfer</option></select><select id="filterCategory" class="field-control filter-control"><option value="all">All categories</option>${data.categories.map(c=>`<option value="${esc(c.id)}" ${txFilters.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="filterAccount" class="field-control filter-control"><option value="all">All accounts</option>${data.accounts.map(a=>`<option value="${esc(a.id)}" ${txFilters.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><section class="panel"><div class="panel-head"><div><h3>Search results</h3><div class="panel-sub">${t.length} transaction</div></div><button class="link-btn" data-action="downloadCSV">Export CSV</button></div><div id="txResults">${transactionTable(t)}</div></section>`}
function renderBudgets(){const b=data.budgets[selectedMonth]||{},sp=catExpenses(),planned=Object.values(b).reduce((s,x)=>s+num(x),0),used=Object.keys(b).reduce((s,k)=>s+num(sp[k]),0),allExpense=totals().expense;return `<div class="section-top"><div><h3 class="section-title">Spending plan ${monthLabel(selectedMonth)}</h3><div class="section-note">A budget is a spending plan, not money deducted from your account</div></div><button class="btn ghost" data-action="copyBudget">Copy last month’s budgets</button></div><section class="stats">${stat('Total planned budgets',money(planned),'sliders','blue','Sum of category limits')}${stat('Spending in budgeted categories',money(used),'up','red','Spending against category limits')}${stat('Remaining budget',money(planned-used),'wallet',planned-used>=0?'green':'red','May be negative if overspent')}${stat('Total spending',money(allExpense),'coins','amber','Includes unbudgeted categories')}</section><div class="panel"><div class="panel-head"><div><h3>Category details</h3><div class="panel-sub">Click Set limit to edit a category budget</div></div></div><div class="grid-equal" style="margin-bottom:0"><div>${data.categories.filter((c,i)=>i%2===0).map(c=>budgetRow(c,selectedMonth,true)).join('')}</div><div>${data.categories.filter((c,i)=>i%2!==0).map(c=>budgetRow(c,selectedMonth,true)).join('')}</div></div></div><p class="notepad" style="margin-top:15px">Important: Savings and investments can have a planned budget, but moving money between your own accounts must be recorded as a transfer, not an expense. Transfers do not consume category budgets.</p>`}
function renderAccounts(){return `<div class="section-top"><div><h3 class="section-title">Your accounts & wallets</h3><div class="section-note">Current balance = Opening balance + income − expenses ± transfers</div></div><button class="btn primary" data-action="openAccount">${ico('plus')} Add account</button></div><section class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stat('Combined account balances',money(allBalance()),'wallet','blue','Transfers are not counted as new income')}${stat('Number of accounts',String(data.accounts.length),'coins','green','Cash, bank and wallet accounts')}</section><section class="grid-cards">${data.accounts.map(a=>`<article class="account-card"><div class="account-head"><div class="account-symbol">${ico('wallet',20)}</div><button class="tiny-btn" data-action="editAccount" data-id="${esc(a.id)}">Edit</button></div><h3 style="font-size:13px;margin:15px 0 0">${esc(a.name)}</h3><div class="account-kind">${esc(KIND_NAMES[a.kind]||'Account')}</div><div class="account-balance ${accountBalance(a.id)<0?'negative':''}">${money(accountBalance(a.id))}</div><div class="account-kind">Opening balance: ${money(a.opening)}</div><div style="display:flex;gap:7px;margin-top:16px"><button class="btn soft sm" data-action="openTx" data-type="income" data-account="${esc(a.id)}">Add income</button><button class="btn ghost sm" data-action="openTx" data-type="expense" data-account="${esc(a.id)}">Expense</button></div></article>`).join('')}</section><div class="notepad">Updating the opening balance changes the calculated account balance. Use transfers to move funds between accounts without inflating income or expenses.</div>`}
function renderGoals(){return `<div class="section-top"><div><h3 class="section-title">Financial goals</h3><div class="section-note">Set a goal for a project, emergency fund, or savings, and link transfers to it</div></div><button class="btn primary" data-action="openGoal">${ico('plus')} New goal</button></div>${data.goals.length?`<section class="grid-cards">${data.goals.map(g=>{const progress=goalProgress(g),ratio=progress/g.target*100;return `<article class="goal-card"><div class="account-head"><div class="account-symbol" style="color:#8c6dd8;background:#f2edff">${ico('target',20)}</div><button class="tiny-btn" data-action="editGoal" data-id="${esc(g.id)}">Edit</button></div><h3 class="goal-title">${esc(g.name)}</h3><div class="account-kind">Linked account: ${esc(account(g.accountId)?.name||'—')}</div><div style="display:flex;justify-content:space-between;margin-top:18px;gap:8px;align-items:center"><strong style="font-size:17px">${money(progress)}</strong><span class="pill">Goal ${money(g.target)}</span></div><div class="goal-track"><div style="width:${clamp(ratio)}%"></div></div><div class="goal-meta"><span>${Math.round(ratio)}% Complete</span><span>Remaining ${money(Math.max(0,g.target-progress))}</span></div><div class="actions"><button class="btn soft sm" data-action="contribute" data-id="${esc(g.id)}">${ico('plus')} Contribute</button><button class="btn ghost sm" data-action="withdrawGoal" data-id="${esc(g.id)}">Withdraw</button></div></article>`}).join('')}</section>`:`<section class="panel"><div class="empty">${ico('target',35)}<strong>No financial goals yet</strong><span>For example: a new device, emergency fund, project or trip</span><button class="btn primary" data-action="openGoal">Create your first goal</button></div></section>`}<div class="notepad">Goal progress reflects the starting amount you set and transfers linked to the goal. A goal’s starting amount is for tracking only and does not change your account balance. Multiple goals may share an account.</div>`}
function renderReports(){const now=totals(),exp=catExpenses(),items=Object.entries(exp).sort((a,b)=>b[1]-a[1]),peak=Math.max(1,...items.map(x=>x[1]));const year=selectedMonth.slice(0,4),rows=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`),annual=rows.map(m=>totals(m)),inc=annual.reduce((s,v)=>s+v.income,0),spend=annual.reduce((s,v)=>s+v.expense,0);return `<div class="section-top"><div><h3 class="section-title">Reports ${monthLabel(selectedMonth)}</h3><div class="section-note">Spending trends, categories and annual comparisons</div></div><button class="btn ghost" data-action="downloadCSV">${ico('download')} Export transactions CSV</button></div><section class="stats">${stat('Monthly income',money(now.income),'down','green','')}${stat('Monthly expenses',money(now.expense),'up','red','')}${stat('Net cash flow',money(now.income-now.expense),'coins','blue','')}${stat('Surplus rate',now.income?moneyN((now.income-now.expense)/now.income*100)+'%':'—','chart','amber','Surplus as a share of income')}</section><div class="grid-2"><section class="panel"><div class="panel-head"><div><h3>Six-month trend</h3><div class="panel-sub">Income vs expenses</div></div></div>${barChart()}</section><section class="panel"><div class="panel-head"><div><h3>Spending breakdown</h3><div class="panel-sub">${monthLabel(selectedMonth)}</div></div></div>${donut()}</section></div><div class="grid-equal"><section class="panel"><div class="panel-head"><div><h3>Ranked expense categories</h3><div class="panel-sub">Highest to lowest</div></div></div>${items.length?`<div class="report-list">${items.map(([k,v])=>`<div class="report-bar"><span>${esc(category(k)?.name||'Category')}</span><div class="bar"><div style="width:${v/peak*100}%;background:${category(k)?.color||'#5265dd'}"></div></div><span class="value">${money(v)}</span></div>`).join('')}</div>`:`<div class="empty">${ico('chart')}<strong>No data to display</strong></div>`}</section><section class="panel"><div class="panel-head"><div><h3>Annual summary ${esc(year)}</h3><div class="panel-sub">All months in this year</div></div></div><div class="settings-row"><span>Total income</span><strong class="positive">${money(inc)}</strong></div><div class="settings-row"><span>Total expenses</span><strong class="negative">${money(spend)}</strong></div><div class="settings-row"><span>Annual net</span><strong>${money(inc-spend)}</strong></div><div class="settings-row"><span>Average monthly expenses (12 months)</span><strong>${money(spend/12)}</strong></div><p class="small muted">Summary covers the entire calendar year. The average uses 12 months even if some months have no entries.</p></section></div>`}
function renderSettings(){return `<div class="section-top"><div><h3 class="section-title">Manage your data</h3><div class="section-note">Manage categories, exports, and recovery options</div></div></div><div class="grid-equal"><section class="panel"><div class="panel-head"><h3>Backup & restore</h3></div><div class="settings-row"><div><h4>Export full backup JSON</h4><p>Includes transactions, envelopes, debts, schedules, goals and categories</p></div><button class="btn soft sm" data-action="exportJSON">${ico('download')} Export</button></div><div class="settings-row"><div><h4>Import backup</h4><p>This will replace all current data after confirmation</p></div><label class="btn ghost sm" for="importFile">${ico('upload')} Import</label><input type="file" id="importFile" class="screen-reader" accept=".json,application/json"/></div><div class="settings-row"><div><h4>Export transactions CSV</h4><p>A file that opens in Excel and spreadsheet apps</p></div><button class="btn ghost sm" data-action="downloadCSV">${ico('download')} CSV</button></div><div class="settings-row"><div><h4>Demo data</h4><p>Explore reports with sample transactions</p></div><button class="btn ghost sm" data-action="demo">Load demo</button></div><div class="settings-row"><div><h4>Delete all data</h4><p>Removes your financial records from the cloud and synced devices</p></div><button class="btn danger sm" data-action="reset">${ico('trash')} Delete</button></div></section><section class="panel"><div class="panel-head"><div><h3>Categories</h3><div class="panel-sub">Add or rename categories</div></div><button class="btn soft sm" data-action="openCategory">${ico('plus')} Category</button></div><div class="cats">${data.categories.map(c=>`<span class="cat-chip">${categoryIcon(c)} ${esc(c.name)} <button data-action="editCategory" data-id="${esc(c.id)}" title="Edit category">✎</button></span>`).join('')}</div><hr class="separator"/><div class="notepad"><strong>Storage status:</strong> Cloud storage when connected to Supabase; otherwise, stored in this browser only.<br><strong>Currency:</strong> Egyptian Pound (EGP).<br><strong>Data type:</strong> Manually entered transactions; no bank connections.<br><strong>Privacy:</strong> Data is stored in your Supabase project, with access restricted to your account.</div></section></div><section class="panel"><div class="panel-head"><h3>Important information</h3></div><div class="small muted" style="line-height:2.2">• Once connected to Supabase your data syncs after login. Check sync status and export a JSON regularly.<br>• This version supports cloud login and sync after setup. When hosted on HTTPS you can install it as a web app for quick access.<br>• Budgets set spending limits but do not reduce account balances. Internal transfers are excluded from income and expense reporting.<br>• Enter each account’s opening balance once rather than treating existing funds as new income.</div></section>`}
function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-layer" id="modalLayer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h3 id="modalTitle">${esc(title)}</h3><button class="modal-close" data-action="closeModal" aria-label="Close">×</button></div>${body}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('#modalRoot input:not([type=hidden]),#modalRoot select')?.focus(),60)}
function closeModal(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
function formActions(){return `<div class="modal-footer"><button type="button" class="btn ghost" data-action="closeModal">Cancel</button><button type="submit" class="btn primary">Save changes</button></div>`}
let txDraft={};
function openTx(o={}){const original=o.id?data.transactions.find(x=>x.id===o.id):null;if(original?.debtId){toast('Loan transactions are managed in Debts & loans','error');return}txDraft={id:o.id||'',type:o.type||original?.type||'expense',amount:o.amount??original?.amount??'',date:o.date||original?.date||localDate(),description:o.description??original?.description??'',accountId:o.accountId||original?.accountId||data.accounts[0]?.id||'',toAccountId:o.toAccountId||original?.toAccountId||data.accounts.find(a=>a.id!==data.accounts[0]?.id)?.id||'',categoryId:o.categoryId||original?.categoryId||data.categories[0]?.id||'',goalId:o.goalId||original?.goalId||'',splits:structuredClone(original?.splits||[])};if(o.goalId){const g=goal(o.goalId);if(g){const other=data.accounts.find(a=>a.id!==g.accountId)?.id||'';if(o.withdraw){txDraft.accountId=g.accountId;txDraft.toAccountId=other}else{txDraft.accountId=other;txDraft.toAccountId=g.accountId}}}renderTxModal()}
function getTxDraft(){const f=document.getElementById('txForm');if(!f)return txDraft;const fd=new FormData(f);for(const k of ['amount','date','description','accountId','toAccountId','categoryId','goalId'])if(fd.has(k))txDraft[k]=fd.get(k);if(f.querySelector('[data-split-row]'))txDraft.splits=[...f.querySelectorAll('[data-split-row]')].map(row=>({categoryId:row.querySelector('[name="splitCategory"]').value,amount:row.querySelector('[name="splitAmount"]').value}));return txDraft}
function renderTxModal(){const t=txDraft.type;const tabs=[['expense','Expense'],['income','Income'],['transfer','Transfer']];const splitActive=t==='expense'&&txDraft.splits?.length>1;openModal(txDraft.id?'Edit transaction':'New transaction',`<div class="type-switch">${tabs.map(([k,v])=>`<button type="button" data-action="switchTx" data-type="${k}" class="${t===k?'active':''}">${v}</button>`).join('')}</div><form id="txForm"><div class="form-grid"><div class="form-field"><label for="txAmount">Amount (EGP) *</label><input id="txAmount" name="amount" type="number" min="0.01" max="1000000000000" step="0.01" required placeholder="e.g. 250" value="${esc(txDraft.amount)}" /></div><div class="form-field"><label for="txDate">Date *</label><input id="txDate" name="date" type="date" required value="${esc(txDraft.date)}" /></div></div><div class="form-grid"><div class="form-field"><label for="txAccount">${t==='transfer'?'From Account *':t==='income'?'To Account *':'From Account *'}</label><select id="txAccount" name="accountId" required>${options(data.accounts,txDraft.accountId,'Select Account')}</select></div>${t==='transfer'?`<div class="form-field"><label for="txTo">To Account *</label><select id="txTo" name="toAccountId" required>${options(data.accounts,txDraft.toAccountId,'Select Account')}</select></div>`:t==='expense'&&!splitActive?`<div class="form-field"><label for="txCategory">Category *</label><select id="txCategory" name="categoryId" required>${options(data.categories,txDraft.categoryId,'Select Category')}</select></div>`:''}</div>${t==='expense'?`<div class="split-heading"><strong>Split expense</strong><button type="button" class="btn ghost sm" data-action="${splitActive?'disableSplit':'activateSplit'}">${splitActive?'Single category':'Split across categories'}</button></div>${splitActive?`<div class="split-list">${txDraft.splits.map((row,i)=>`<div class="split-row" data-split-row><span class="split-num">${i+1}</span><select name="splitCategory" aria-label="Split category ${i+1}" required>${options(data.categories,row.categoryId,'Select Category')}</select><input name="splitAmount" aria-label="Split amount ${i+1}" type="number" min="0.01" step="0.01" value="${esc(row.amount)}" placeholder="Amount" required/>${txDraft.splits.length>2?`<button class="tiny-btn" type="button" data-action="removeSplit" data-id="${i}" aria-label="Remove split">✕</button>`:''}</div>`).join('')}</div><button type="button" class="link-btn" data-action="addSplit">+ Add another category</button><p class="helper">Split amounts must equal the total expense to the cent.</p>`:''}`:''}${t==='transfer'&&data.goals.length?`<div class="form-field"><label for="txGoal">Link transfer to goal (optional)</label><select id="txGoal" name="goalId">${options(data.goals,txDraft.goalId,'No goal')}</select></div>`:''}<div class="form-field"><label for="txDescription">Description (optional)</label><input id="txDescription" name="description" maxlength="240" placeholder="e.g. Monthly groceries" value="${esc(txDraft.description)}" /></div>${t==='transfer'?'<div class="notepad" style="margin-bottom:14px">Transfers between your accounts do not count as income or spending.</div>':''}${formActions()}</form>`)}
function saveTx(){const f=document.getElementById('txForm');if(!f||!f.reportValidity())return;getTxDraft();const t=txDraft;const amount=num(t.amount),date=t.date,accountId=t.accountId,toAccountId=t.toAccountId,categoryId=t.categoryId,goalId=t.type==='transfer'?t.goalId:'';if(!goodAmount(amount)||!Number.isInteger(Math.round(amount*100))){toast('Enter a valid positive amount','error');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())){toast('Invalid transaction date','error');return}if(!account(accountId)){toast('Select a valid account','error');return}const splits=t.type==='expense'&&t.splits?.length>1?t.splits.map(x=>({categoryId:x.categoryId,amount:num(x.amount)})):[];if(t.type==='expense'&&splits.length){if(splits.some(x=>!category(x.categoryId)||!goodAmount(x.amount))||new Set(splits.map(x=>x.categoryId)).size!==splits.length){toast('Use distinct split categories and valid amounts','error');return}const sum=splits.reduce((a,x)=>a+Math.round(x.amount*100),0);if(sum!==Math.round(amount*100)){toast('Splits must equal the total amount','error');return}}else if(t.type==='expense'&&!category(categoryId)){toast('Select an expense category','error');return}if(t.type==='transfer'&&(!account(toAccountId)||accountId===toAccountId)){toast('Select two different accounts for a transfer','error');return}if(t.type==='transfer'&&goalId){const g=goal(goalId);if(!g||![accountId,toAccountId].includes(g.accountId)){toast('The goal’s account must be one side of the transfer','error');return}}const old=t.id?data.transactions.find(x=>x.id===t.id):null;if(old?.debtId){toast('Loans are managed in the Debts & loans section','error');return}const tx={id:t.id||id(),type:t.type,date,amount,description:String(t.description||'').trim().slice(0,240),accountId,categoryId:t.type==='expense'?(splits[0]?.categoryId||categoryId):'',toAccountId:t.type==='transfer'?toAccountId:'',goalId,createdAt:old?.createdAt||new Date().toISOString()};if(splits.length)tx.splits=splits;if(old){tx.recurringId=old.recurringId||'';tx.occurrenceDate=old.occurrenceDate||'';data.transactions=data.transactions.map(x=>x.id===old.id?tx:x)}else data.transactions.push(tx);safeSave();selectedMonth=date.slice(0,7);closeModal();render();toast(old?'Transaction updated':'Transaction saved')}
function deleteTx(transactionId){const t=data.transactions.find(x=>x.id===transactionId);if(!t)return;if(t.debtId){toast('Edit or delete a loan from Debts & loans','error');return}if(!confirm('Are you sure you want to delete the transaction «'+txName(t)+'»?'))return;data.transactions=data.transactions.filter(x=>x.id!==transactionId);safeSave();render();toast('Transaction deleted')}
function openBudget(categoryId){const c=category(categoryId);if(!c)return;const current=data.budgets[selectedMonth]?.[categoryId]??0;openModal('Budget: '+c.name,`<form id="budgetForm" data-category="${esc(categoryId)}"><div class="form-field"><label for="budgetAmount">Planned amount for ${monthLabel(selectedMonth)} (EGP)</label><input id="budgetAmount" type="number" min="0" max="1000000000000" step="0.01" required name="amount" value="${esc(current)}"/></div><div class="notepad">This is a planned limit, not an expense. Your account balance will not change. Enter zero to remove the budget.</div>${formActions()}</form>`)}
function saveBudget(){const f=document.getElementById('budgetForm');if(!f||!f.reportValidity())return;const v=Number(new FormData(f).get('amount')),c=f.dataset.category;if(!Number.isFinite(v)||v<0||v>1e12||!category(c)){toast('Invalid amount','error');return}if(!data.budgets[selectedMonth])data.budgets[selectedMonth]={};if(v===0)delete data.budgets[selectedMonth][c];else data.budgets[selectedMonth][c]=v;safeSave();closeModal();render();toast('Budget updated')}
function copyBudget(){const prior=prevMonth(selectedMonth),source=data.budgets[prior];if(!source||!Object.keys(source).length){toast('No budgets to copy from last month','error');return}if(Object.keys(data.budgets[selectedMonth]||{}).length&&!confirm('Replace this month’s budgets with last month’s?'))return;data.budgets[selectedMonth]={...source};safeSave();render();toast('Last month’s budgets copied')}
function openAccountForm(accountId){const a=account(accountId)||{};openModal(accountId?'Edit account':'Create account',`<form id="accountForm" data-id="${esc(accountId||'')}"><div class="form-field"><label for="accName">Account name *</label><input id="accName" type="text" name="name" maxlength="60" required placeholder="e.g. Bank account or cash" value="${esc(a.name||'')}"/></div><div class="form-grid"><div class="form-field"><label for="accKind">Account type</label><select id="accKind" name="kind">${Object.entries(KIND_NAMES).map(([key,value])=>`<option value="${key}" ${a.kind===key?'selected':''}>${value}</option>`).join('')}</select></div><div class="form-field"><label for="accOpening">Opening balance (EGP)</label><input id="accOpening" type="number" name="opening" step="0.01" min="-1000000000000" max="1000000000000" required value="${esc(a.opening??0)}"/></div></div><p class="helper">Enter the account balance before your first Mizan transaction. Do not record the same funds again as income.</p>${formActions()}</form>${accountId?`<div style="margin-top:12px;text-align:left"><button class="btn danger sm" data-action="deleteAccount" data-id="${esc(accountId)}">Delete account</button></div>`:''}`)}
function saveAccount(){const f=document.getElementById('accountForm');if(!f||!f.reportValidity())return;const fd=new FormData(f),name=fd.get('name').trim(),kind=fd.get('kind'),opening=Number(fd.get('opening')),accountId=f.dataset.id;if(!name||!Object.keys(KIND_NAMES).includes(kind)||!Number.isFinite(opening)||Math.abs(opening)>1e12){toast('Check account details','error');return}if(data.accounts.some(a=>a.name===name&&a.id!==accountId)){toast('An account with this name already exists','error');return}const item={id:accountId||id(),name,kind,opening};if(accountId)data.accounts=data.accounts.map(a=>a.id===accountId?item:a);else data.accounts.push(item);safeSave();closeModal();render();toast('Account saved')}
function deleteAccount(accountId){if(data.accounts.length<=2){toast('You need at least two accounts for transfers','error');return}if(data.transactions.some(t=>t.accountId===accountId||t.toAccountId===accountId)||data.goals.some(g=>g.accountId===accountId)||data.recurring.some(r=>r.accountId===accountId)||data.debts.some(d=>d.accountId===accountId||d.payments.some(p=>p.accountId===accountId))){toast('This account has linked transactions or goals and cannot be deleted','error');return}if(!confirm('Delete this account permanently?'))return;data.accounts=data.accounts.filter(a=>a.id!==accountId);safeSave();closeModal();render();toast('Account deleted')}
function openGoalForm(goalId){const g=goal(goalId)||{};openModal(goalId?'Edit financial goal':'New financial goal',`<form id="goalForm" data-id="${esc(goalId||'')}"><div class="form-field"><label for="goalName">Goal name *</label><input id="goalName" name="name" maxlength="80" required placeholder="e.g. Emergency fund" value="${esc(g.name||'')}"/></div><div class="form-grid"><div class="form-field"><label for="goalTarget">Target amount (EGP) *</label><input id="goalTarget" name="target" type="number" min="0.01" max="1000000000000" step="0.01" required value="${esc(g.target||'')}" /></div><div class="form-field"><label for="goalStarting">Starting goal amount (EGP)</label><input id="goalStarting" name="starting" type="number" min="0" max="1000000000000" step="0.01" required value="${esc(g.starting??0)}" /></div></div><div class="form-field"><label for="goalAccount">Account holding the goal funds *</label><select id="goalAccount" name="accountId" required>${options(data.accounts,g.accountId||data.accounts.find(a=>a.kind==='savings')?.id||data.accounts[0]?.id,'Select an account')}</select></div><div class="notepad" style="margin-bottom:16px">Goal progress = Starting goal amount + linked deposits − linked withdrawals. The starting amount does not increase the account balance.</div>${formActions()}</form>${goalId?`<div style="margin-top:12px;text-align:left"><button class="btn danger sm" data-action="deleteGoal" data-id="${esc(goalId)}">Delete goal</button></div>`:''}`)}
function saveGoal(){const f=document.getElementById('goalForm');if(!f||!f.reportValidity())return;const fd=new FormData(f),name=fd.get('name').trim(),target=Number(fd.get('target')),starting=Number(fd.get('starting')),accountId=fd.get('accountId'),goalId=f.dataset.id;if(!name||!goodAmount(target)||!Number.isFinite(starting)||starting<0||starting>1e12||!account(accountId)){toast('Check goal details','error');return}if(goalId&&data.transactions.some(t=>t.goalId===goalId&&t.type==='transfer'&&![t.accountId,t.toAccountId].includes(accountId))){toast('Cannot change the goal account while linked transfers use another account. Edit those transfers first.','error');return}const item={id:goalId||id(),name,target,starting,accountId};if(goalId)data.goals=data.goals.map(g=>g.id===goalId?item:g);else data.goals.push(item);safeSave();closeModal();render();toast('Goal saved')}
function deleteGoal(goalId){if(!goal(goalId))return;if(data.transactions.some(t=>t.goalId===goalId)){toast('Unlink transfers from this goal before deleting it','error');return}if(!confirm('Delete financial goal?'))return;data.goals=data.goals.filter(x=>x.id!==goalId);safeSave();closeModal();render();toast('Goal deleted')}
function openCategoryForm(catId){const c=category(catId)||{};openModal(catId?'Edit category':'New category',`<form id="categoryForm" data-id="${esc(catId||'')}"><div class="form-field"><label for="catName">Category name *</label><input id="catName" name="name" type="text" maxlength="50" required placeholder="e.g. Travel" value="${esc(c.name||'')}"/></div><div class="form-field"><label for="catColor">Color</label><input id="catColor" name="color" type="color" value="${esc(c.color||'#5265dd')}" style="height:47px;padding:5px"/></div>${formActions()}</form>${catId?`<div style="margin-top:12px;text-align:left"><button class="btn danger sm" data-action="deleteCategory" data-id="${esc(catId)}">Delete category</button></div>`:''}`)}
function saveCategory(){const f=document.getElementById('categoryForm');if(!f||!f.reportValidity())return;const fd=new FormData(f),name=fd.get('name').trim(),color=fd.get('color'),catId=f.dataset.id;if(!name||!/^#[0-9a-f]{6}$/i.test(color)){toast('Invalid name or color','error');return}if(data.categories.some(c=>c.name===name&&c.id!==catId)){toast('A category with this name already exists','error');return}const c={id:catId||id(),name,color};if(catId)data.categories=data.categories.map(x=>x.id===catId?c:x);else data.categories.push(c);safeSave();closeModal();render();toast('Category saved')}
function deleteCategory(catId){if(data.transactions.some(t=>t.categoryId===catId||t.splits?.some(x=>x.categoryId===catId))||data.recurring.some(r=>r.categoryId===catId)||Object.values(data.allocations).some(b=>Object.prototype.hasOwnProperty.call(b,catId))||Object.values(data.budgets).some(b=>Object.prototype.hasOwnProperty.call(b,catId))){toast('This category is linked to transactions or budgets and cannot be deleted','error');return}if(data.categories.length<=1){toast('You must keep at least one category','error');return}if(!confirm('Delete this category?'))return;data.categories=data.categories.filter(x=>x.id!==catId);safeSave();closeModal();render();toast('Category deleted')}
function downloadBlob(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportJSON(){downloadBlob(JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),'Mizan_Backup_'+localDate()+'.json','application/json;charset=utf-8');toast('Backup file prepared')}
function csvSafe(v){let s=String(v??'');if(/^[\s]*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function downloadCSV(){const headers=['Date','Type','Category / split','From account','To account','Amount EGP','Description','Goal'];const rows=sortedTx(data.transactions).map(t=>[t.date,typeLabel(t),t.type==='expense'?(t.splits?.length>1?t.splits.map(s=>`${category(s.categoryId)?.name||'Category'}: ${s.amount}`).join(' / '):category(t.categoryId)?.name||''):'',account(t.accountId)?.name||'',t.type==='transfer'?account(t.toAccountId)?.name||'':'',t.amount,t.description||'',t.goalId?goal(t.goalId)?.name||'':'']);const output='\ufeff'+[headers,...rows].map(arr=>arr.map(csvSafe).join(',')).join('\r\n');downloadBlob(output,'Mizan_Transactions_'+localDate()+'.csv','text/csv;charset=utf-8');toast('File ready: CSV for all transactions')}
async function importJSON(file){if(!file)return;if(file.size>25*1024*1024){toast('File exceeds 25 MB','error');return}try{const json=JSON.parse(await file.text());if(!validData(json)){toast('Invalid backup file','error');return}if(!confirm('Importing will replace your current data. Export a backup first. Continue?'))return;const old=data;data=upgradeData(json);if(!safeSave()){data=old;return}page='dashboard';render();toast('Backup restored successfully')}catch(e){toast('Cannot read or parse this file','error')}finally{const f=document.getElementById('importFile');if(f)f.value=''}}
function makeDemo(){if(!confirm('This will replace your current data with demo entries. Export a backup first. Continue?'))return;const d=fresh();d.accounts.find(a=>a.id==='cash').opening=5200;d.accounts.find(a=>a.id==='bank').opening=18500;d.accounts.find(a=>a.id==='wallet').opening=1200;d.accounts.find(a=>a.id==='saving').opening=7500;for(let idx=5;idx>=0;idx--){const m=prevMonth(localMonth(),idx);const yr=Number(m.slice(0,4)),mo=Number(m.slice(5,7))-1;const make=(day,type,amount,cat,acc,description,to='',g='')=>{const t={id:id(),type,date:localDate(new Date(yr,mo,idx===0?Math.min(day,new Date().getDate()):day)),amount,categoryId:cat===null?'':'cat'+cat,accountId:acc,toAccountId:to,description,goalId:g,createdAt:new Date(yr,mo,day).toISOString()};d.transactions.push(t)};make(1,'income',15000+idx*600,null,'bank','Salary');make(3,'expense',3100+idx*90,0,'bank','Household expenses');make(5,'expense',500+idx*25,1,'wallet','Charity donation');make(8,'expense',1550+idx*50,9,'cash','Groceries and food');make(11,'expense',700+idx*40,10,'cash','Transport');make(15,'expense',1050+idx*35,6,'bank','Study supplies');make(19,'income',2700+idx*100,null,'wallet','Freelance income');make(22,'expense',750+idx*25,8,'wallet','Entertainment');make(25,'expense',700+idx*15,4,'cash','Personal spending');make(26,'transfer',2000,null,'bank','Savings transfer','saving');d.budgets[m]={'cat0':4500,'cat1':1000,'cat2':3500,'cat4':1300,'cat6':2000,'cat8':1100,'cat9':2500,'cat10':1200}}d.goals=[{id:'demo-goal',name:'Emergency fund',target:30000,starting:3500,accountId:'saving'}];const linked=d.transactions.filter(t=>t.type==='transfer').slice(0,3);linked.forEach(t=>t.goalId='demo-goal');data=d;selectedMonth=localMonth();page='dashboard';safeSave();render();toast('Demo data loaded. These are not your real transactions.')}
function resetData(){const answer=prompt('Type DELETE to permanently erase all finance data across your synced devices:');if(answer!=='DELETE')return;data=fresh();selectedMonth=localMonth();page='dashboard';if(!safeSave())return;render();toast('Data deleted. Syncing deletion now.')}
/* ---------------- MIZAN V3 FEATURES ---------------- */
function cents(v){return Math.round(num(v)*100)}
function safeDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(String(v))&&localDate(new Date(v+'T12:00:00'))===v}
function monthNext(v,freq,anchorDay){const d=new Date(v+'T12:00:00');if(freq==='weekly'){d.setDate(d.getDate()+7)}else{const y=d.getFullYear(),m=d.getMonth()+1,day=anchorDay||d.getDate();d.setFullYear(y,m,1);const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max))}return localDate(d)}
function envelopeRemaining(catId,month=selectedMonth){return num(data.allocations?.[month]?.[catId])-num(catExpenses(month)[catId])}
function renderAllocations(){const allocations=data.allocations?.[selectedMonth]||{},spent=catExpenses(),assigned=Object.values(allocations).reduce((a,b)=>a+num(b),0),used=totals().expense,unassigned=totals().income-assigned;return `<div class="section-top"><div><h3 class="section-title">Envelopes ${monthLabel(selectedMonth)}</h3><div class="section-note">Plan how to allocate your income; no funds are withdrawn. Envelopes are separate from budget limits.</div></div><button class="btn ghost" data-action="copyAllocations">Copy last month</button></div><div class="metric-grid"><div class="metric"><small>Total envelopes</small><strong>${money(assigned)}</strong></div><div class="metric"><small>Unallocated monthly income</small><strong class="${unassigned<0?'negative':'positive'}">${money(unassigned)}</strong></div><div class="metric"><small>Total monthly expenses</small><strong>${money(used)}</strong></div></div><section class="panel"><div class="panel-head"><div><h3>Envelopes by category</h3><p class="panel-sub">Remaining = Allocated − spent (may be negative)</p></div></div><div class="grid-equal"><div class="box-stack">${data.categories.filter((_,i)=>i%2===0).map(c=>allocationCard(c,allocations,spent)).join('')}</div><div class="box-stack">${data.categories.filter((_,i)=>i%2!==0).map(c=>allocationCard(c,allocations,spent)).join('')}</div></div></section><p class="notepad">Allocations are planning tools. They do not reserve real funds or reduce bank balances. You can allocate more than your income; negative unallocated income signals over-allocation.</p>`}
function allocationCard(c,allocations,spent){const val=num(allocations[c.id]),used=num(spent[c.id]),left=val-used,p=val?clamp(100*used/val):0;return `<div class="feature-card"><div class="feature-head"><h4>${categoryIcon(c)} ${esc(c.name)}</h4><button class="tiny-btn" data-action="setAllocation" data-id="${esc(c.id)}">Allocate</button></div><div class="feature-meta">Allocated: <b>${money(val)}</b> • Spent: <b>${money(used)}</b></div><div class="budget-track" style="margin-top:11px"><div class="budget-fill" style="background:${left<0?'#e25b6b':c.color};width:${p}%"></div></div><div class="feature-meta ${left<0?'negative':'positive'}">Available: ${money(left)}</div></div>`}
function openAllocation(catId){const c=category(catId);if(!c)return;const current=num(data.allocations[selectedMonth]?.[catId]);openModal('Allocate to '+c.name,`<form id="allocationForm" data-id="${esc(catId)}"><p class="helper">This allocation is a plan and does not reduce your account balances.</p><div class="form-field"><label>Allocated amount (EGP)</label><input type="number" name="amount" min="0" max="1000000000000" step="0.01" required value="${current}" /></div>${formActions()}</form>`)}
function saveAllocation(){const f=document.getElementById('allocationForm');if(!f?.reportValidity())return;const amount=Number(new FormData(f).get('amount'));if(!Number.isFinite(amount)||amount<0||amount>1e12)return toast('Invalid amount','error');data.allocations[selectedMonth]??={};data.allocations[selectedMonth][f.dataset.id]=amount;safeSave();closeModal();render();toast('Allocation saved')}
function copyAllocations(){const previous=data.allocations[prevMonth(selectedMonth)];if(!previous||!Object.keys(previous).length)return toast('No envelopes to copy from last month','error');if(!confirm('Replace this month’s allocations with last month’s?'))return;data.allocations[selectedMonth]={...previous};safeSave();render();toast('Envelopes copied')}
function renderRecurring(){const active=data.recurring.filter(r=>r.active!==false),due=active.filter(r=>r.nextDue<=localDate()).length;return `<div class="section-top"><div><h3 class="section-title">Recurring bills & transactions</h3><p class="section-note">Due dates are scheduled, but no money moves until you confirm the payment.</p></div><button class="btn primary" data-action="openRecurring">${ico('plus')} Recurring transaction</button></div><div class="metric-grid"><div class="metric"><small>Total schedules</small><strong>${data.recurring.length}</strong></div><div class="metric"><small>Active</small><strong>${active.length}</strong></div><div class="metric"><small>Due now / overdue</small><strong class="${due?'negative':''}">${due}</strong></div></div><div class="box-stack">${!data.recurring.length?`<section class="panel empty"><strong>No recurring transactions yet</strong><span>Add a subscription, bill, or recurring income above</span></section>`:sortedRecurring().map(r=>`<section class="feature-card"><div class="feature-head"><h4>${esc(r.name)}</h4><span class="pill ${r.active!==false?(r.nextDue<=localDate()?'red':'green'):''}">${r.active===false?'Paused':r.nextDue<=localDate()?'Due':'Scheduled'}</span></div><div class="feature-meta">${r.type==='income'?'Income':'Expense'} ${money(r.amount)} • ${r.frequency==='monthly'?'Monthly':'Weekly'} • Next due date: <span class="ltr">${dateLabel(r.nextDue)}</span></div><div class="feature-meta">${esc(account(r.accountId)?.name||'—')}${r.type==='expense'?' • '+esc(category(r.categoryId)?.name||'—'):''}</div><div class="feature-actions">${r.active!==false?`<button class="btn primary sm" data-action="payRecurring" data-id="${esc(r.id)}">${r.type==='income'?'Confirm receipt':'Confirm payment'}</button>${r.nextDue<=localDate()?`<button class="btn ghost sm" data-action="skipRecurring" data-id="${esc(r.id)}">Skip this occurrence</button>`:''}`:''}<button class="btn ghost sm" data-action="openRecurring" data-id="${esc(r.id)}">Edit</button><button class="btn ghost sm" data-action="toggleRecurring" data-id="${esc(r.id)}">${r.active===false?'Enable':'Pause'}</button><button class="btn danger sm" data-action="deleteRecurring" data-id="${esc(r.id)}">Delete schedule</button></div></section>`).join('')}</div><p class="notepad" style="margin-top:15px">Deleting a schedule does not delete previously confirmed payments. You can record overdue payments in due-date order.</p>`}
function sortedRecurring(){return [...data.recurring].sort((a,b)=>a.nextDue.localeCompare(b.nextDue))}
function openRecurringForm(ruleId){const r=data.recurring.find(x=>x.id===ruleId)||{type:'expense',frequency:'monthly',active:true,amount:'',nextDue:localDate(),accountId:data.accounts[0]?.id,categoryId:data.categories[0]?.id,name:''};openModal(ruleId?'Edit recurring transaction':'Add recurring transaction',`<form id="recurringForm" data-id="${esc(ruleId||'')}"><div class="form-field"><label>Name *</label><input name="name" required maxlength="100" value="${esc(r.name)}" placeholder="e.g. Monthly internet" /></div><div class="form-grid"><div class="form-field"><label>Type</label><select name="type"><option value="expense" ${r.type==='expense'?'selected':''}>Expense</option><option value="income" ${r.type==='income'?'selected':''}>Income</option></select></div><div class="form-field"><label>Frequency</label><select name="frequency"><option value="monthly" ${r.frequency==='monthly'?'selected':''}>Every month</option><option value="weekly" ${r.frequency==='weekly'?'selected':''}>Every week</option></select></div></div><div class="form-grid"><div class="form-field"><label>Amount</label><input type="number" name="amount" min="0.01" step="0.01" required value="${esc(r.amount)}" /></div><div class="form-field"><label>Next due date</label><input type="date" name="nextDue" required value="${esc(r.nextDue)}" /></div></div><div class="form-grid"><div class="form-field"><label>Account</label><select name="accountId" required>${options(data.accounts,r.accountId)}</select></div><div class="form-field"><label>Category (expense only)</label><select name="categoryId">${options(data.categories,r.categoryId)}</select></div></div><p class="helper">A category applies to expenses only. Creating a schedule does not post a transaction.</p>${formActions()}</form>`)}
function saveRecurring(){const f=document.getElementById('recurringForm');if(!f?.reportValidity())return;const v=new FormData(f),ruleId=f.dataset.id,prior=data.recurring.find(x=>x.id===ruleId),name=String(v.get('name')).trim(),amount=Number(v.get('amount')),nextDue=String(v.get('nextDue')),type=String(v.get('type')),accountId=String(v.get('accountId')),categoryId=String(v.get('categoryId')),frequency=String(v.get('frequency'));if(!name||!goodAmount(amount)||!safeDate(nextDue)||!account(accountId)||(type==='expense'&&!category(categoryId))||!['income','expense'].includes(type)||!['monthly','weekly'].includes(frequency))return toast('Check recurring transaction details','error');const r={id:ruleId||id(),name,amount,nextDue,type,frequency,accountId,categoryId:type==='expense'?categoryId:'',anchorDay:prior?.nextDue===nextDue?prior.anchorDay:Number(nextDue.slice(8)),active:prior?.active!==false,createdAt:prior?.createdAt||new Date().toISOString()};if(prior)data.recurring=data.recurring.map(x=>x.id===ruleId?r:x);else data.recurring.push(r);safeSave();closeModal();render();toast('Recurring transaction saved')}
function toggleRecurring(ruleId){const r=data.recurring.find(x=>x.id===ruleId);if(!r)return;r.active=r.active===false;safeSave();render();toast(r.active?'Recurrence enabled':'Recurrence paused')}
function deleteRecurring(ruleId){const r=data.recurring.find(x=>x.id===ruleId);if(!r||!confirm('Delete this schedule? Past recorded payments will remain.'))return;data.recurring=data.recurring.filter(x=>x.id!==ruleId);safeSave();render();toast('Schedule deleted')}
function payRecurring(ruleId){const r=data.recurring.find(x=>x.id===ruleId);if(!r||r.active===false)return;if(r.nextDue>localDate())return toast('This payment is not yet due. Change its due date first.','error');if(data.transactions.some(t=>t.recurringId===ruleId&&t.occurrenceDate===r.nextDue))return toast('This occurrence has already been recorded','error');if(!confirm(`${r.type==='income'?'Confirm receipt':'Confirm payment for'} ${money(r.amount)} due on ${dateLabel(r.nextDue)}?`))return;const t={id:id(),type:r.type,date:r.nextDue,amount:r.amount,accountId:r.accountId,toAccountId:'',categoryId:r.type==='expense'?r.categoryId:'',description:r.name,goalId:'',recurringId:r.id,occurrenceDate:r.nextDue,createdAt:new Date().toISOString()};data.transactions.push(t);r.nextDue=monthNext(r.nextDue,r.frequency,r.anchorDay);safeSave();render();toast('Payment recorded and next due date updated')}
function skipRecurring(ruleId){const r=data.recurring.find(x=>x.id===ruleId);if(!r||r.active===false||r.nextDue>localDate())return;if(!confirm('Skip the occurrence of '+dateLabel(r.nextDue)+' without recording a financial transaction?'))return;r.nextDue=monthNext(r.nextDue,r.frequency,r.anchorDay);safeSave();render();toast('Due date skipped without charging any account')};
function debtBalance(d){return Math.round((num(d.principal)-(d.payments||[]).reduce((x,y)=>x+num(y.amount),0))*100)/100}
function renderDebts(){const owed=data.debts.filter(d=>d.direction==='lent').reduce((s,d)=>s+Math.max(0,debtBalance(d)),0),due=data.debts.filter(d=>d.direction==='borrowed').reduce((s,d)=>s+Math.max(0,debtBalance(d)),0);return `<div class="section-top"><div><h3 class="section-title">Debts & loans</h3><p class="section-note">Lending, borrowing, and repayments affect account balances but do not count as income or expenses.</p></div><button class="btn primary" data-action="openDebt">${ico('plus')} Debt or loan</button></div><div class="metric-grid"><div class="metric"><small>Amounts owed to you</small><strong class="positive">${money(owed)}</strong></div><div class="metric"><small>Amounts you owe</small><strong class="negative">${money(due)}</strong></div><div class="metric"><small>Net receivables</small><strong>${money(owed-due)}</strong></div></div><div class="box-stack">${!data.debts.length?`<section class="panel empty"><strong>No loans recorded yet</strong><span>Record money you lent or borrowed</span></section>`:data.debts.map(d=>{const remaining=debtBalance(d);return `<section class="feature-card"><div class="feature-head"><h4>${esc(d.name)}</h4><span class="pill ${remaining<=0?'green':d.direction==='lent'?'blue':'red'}">${remaining<=0?'Paid off':d.direction==='lent'?'Owed to me':'I owe'}</span></div><div class="feature-meta">Principal: ${money(d.principal)} • Remaining: <b>${money(remaining)}</b></div><div class="feature-meta">${esc(account(d.accountId)?.name||'—')} • Start date ${dateLabel(d.date)}${d.dueDate?' • Due date '+dateLabel(d.dueDate):''}</div>${d.notes?`<p class="small muted">${esc(d.notes)}</p>`:''}<div class="feature-actions">${remaining>0?`<button class="btn primary sm" data-action="payDebt" data-id="${esc(d.id)}">${d.direction==='lent'?'Record amount received':'Make repayment'}</button>`:''}<button class="btn danger sm" data-action="deleteDebt" data-id="${esc(d.id)}">Delete loan and transactions</button></div>${d.payments?.length?`<details style="margin-top:12px"><summary class="small">Repayment history (${d.payments.length})</summary><div class="small muted" style="margin-top:6px">${d.payments.map(p=>`${dateLabel(p.date)}: ${money(p.amount)}`).join(' • ')}</div></details>`:''}</section>`}).join('')}</div><p class="notepad" style="margin-top:15px">A loan creates a linked account movement, as do repayments. Deleting the loan also deletes all linked financial transactions; use caution.</p>`}
function openDebtForm(){openModal('Add debt or loan',`<form id="debtForm"><div class="form-field"><label>Person or counterparty *</label><input name="name" maxlength="100" placeholder="e.g. Alex" required /></div><div class="form-grid"><div class="form-field"><label>Direction</label><select name="direction"><option value="lent">I lent money (owed to me)</option><option value="borrowed">I borrowed money (I owe)</option></select></div><div class="form-field"><label>Amount</label><input type="number" name="principal" min="0.01" step="0.01" required/></div></div><div class="form-grid"><div class="form-field"><label>Account used</label><select name="accountId" required>${options(data.accounts,data.accounts[0]?.id)}</select></div><div class="form-field"><label>Loan date</label><input name="date" type="date" required value="${localDate()}" /></div></div><div class="form-field"><label>Expected repayment date (optional)</label><input name="dueDate" type="date" /></div><div class="form-field"><label>Notes</label><input name="notes" maxlength="240" /></div><p class="helper">The initial loan amount will be reflected in the chosen account immediately.</p>${formActions()}</form>`)}
function saveDebt(){const f=document.getElementById('debtForm');if(!f?.reportValidity())return;const fd=new FormData(f),name=String(fd.get('name')).trim(),direction=String(fd.get('direction')),principal=Number(fd.get('principal')),accountId=String(fd.get('accountId')),date=String(fd.get('date')),dueDate=String(fd.get('dueDate')),notes=String(fd.get('notes')).trim();if(!name||!['lent','borrowed'].includes(direction)||!goodAmount(principal)||!account(accountId)||!safeDate(date)||(dueDate&&!safeDate(dueDate))||(dueDate&&dueDate<date))return toast('Check loan details','error');const debtId=id(),txId=id();const debt={id:debtId,name,direction,principal,accountId,date,dueDate,notes,payments:[],txId,createdAt:new Date().toISOString()};data.debts.push(debt);data.transactions.push({id:txId,type:direction==='lent'?'loan_out':'loan_in',date,amount:principal,accountId,description:'loan: '+name,categoryId:'',toAccountId:'',goalId:'',debtId,createdAt:new Date().toISOString()});safeSave();closeModal();render();toast('Loan and account transaction saved')}
function openDebtPayment(debtId){const d=data.debts.find(x=>x.id===debtId);if(!d||debtBalance(d)<=0)return;openModal(d.direction==='lent'?'Record loan repayment received':'Record repayment made',`<form id="debtPayForm" data-id="${esc(debtId)}"><p class="helper">Remaining loan balance: ${money(debtBalance(d))}</p><div class="form-grid"><div class="form-field"><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" max="${debtBalance(d)}" required/></div><div class="form-field"><label>Repayment date</label><input name="date" type="date" value="${localDate()}" required/></div></div><div class="form-field"><label>Account ${d.direction==='lent'?'Receiving':'Paying'}</label><select name="accountId" required>${options(data.accounts,d.accountId)}</select></div>${formActions()}</form>`)}
