function saveDebtPayment(){const f=document.getElementById('debtPayForm');if(!f?.reportValidity())return;const d=data.debts.find(x=>x.id===f.dataset.id);if(!d)return;const fd=new FormData(f),amount=Number(fd.get('amount')),accountId=String(fd.get('accountId')),date=String(fd.get('date'));if(!goodAmount(amount)||cents(amount)>cents(debtBalance(d))||!account(accountId)||!safeDate(date)||date<d.date)return toast('Check amount, date, and account','error');const paymentId=id(),txId=id();d.payments.push({id:paymentId,amount,accountId,date,txId});data.transactions.push({id:txId,type:d.direction==='lent'?'loan_repaid':'loan_paid',date,amount,accountId,description:'Loan repayment made: '+d.name,categoryId:'',toAccountId:'',goalId:'',debtId:d.id,createdAt:new Date().toISOString()});safeSave();closeModal();render();toast('Repayment recorded and account balance updated')}
function deleteDebt(debtId){const d=data.debts.find(x=>x.id===debtId);if(!d||!confirm('Delete this loan and every linked account transaction? This cannot be undone.'))return;data.debts=data.debts.filter(x=>x.id!==debtId);data.transactions=data.transactions.filter(x=>x.debtId!==debtId);safeSave();render();toast('Loan and linked transactions deleted')}
function openQuick(){openModal('Quick expense',`<form id="quickForm"><div class="form-field"><label>Amount in EGP</label><input type="number" name="amount" inputmode="decimal" min="0.01" step="0.01" placeholder="150" required autofocus /></div><div class="form-grid"><div class="form-field"><label>Category</label><select name="categoryId" required>${options(data.categories,data.categories.find(c=>c.name==='Food')?.id||data.categories[0]?.id)}</select></div><div class="form-field"><label>Account</label><select name="accountId" required>${options(data.accounts,data.accounts[0]?.id)}</select></div></div><div class="form-field"><label>Date</label><input name="date" type="date" required value="${localDate()}" /></div><div class="form-field"><label>Optional note</label><input name="description" maxlength="240" placeholder="e.g. Breakfast" /></div>${formActions()}</form>`)}
function saveQuick(){const f=document.getElementById('quickForm');if(!f?.reportValidity())return;const fd=new FormData(f),amount=Number(fd.get('amount')),date=String(fd.get('date')),accountId=String(fd.get('accountId')),categoryId=String(fd.get('categoryId')),description=String(fd.get('description')||'').trim();if(!goodAmount(amount)||!safeDate(date)||!account(accountId)||!category(categoryId))return toast('Check the amount, account, and category','error');data.transactions.push({id:id(),type:'expense',date,amount,accountId,categoryId,description,goalId:'',toAccountId:'',createdAt:new Date().toISOString()});safeSave();selectedMonth=date.slice(0,7);closeModal();render();toast('Expense added ✓')}
function dashboardExtras(){const due=data.recurring.filter(r=>r.active!==false&&r.nextDue<=localDate()).slice(0,3),monthAl=data.allocations[selectedMonth]||{},assigned=Object.values(monthAl).reduce((s,x)=>s+num(x),0),spent=totals().expense,loans=data.debts.reduce((s,d)=>s+(d.direction==='lent'?1:-1)*debtBalance(d),0);return `<div class="grid-equal" style="margin-top:17px"><section class="panel"><div class="panel-head"><h3>Money envelopes</h3><button class="link-btn" data-nav="allocations">View envelopes</button></div><div class="metric-grid"><div class="metric"><small>Allocated</small><strong>${money(assigned)}</strong></div><div class="metric"><small>Expense</small><strong>${money(spent)}</strong></div><div class="metric"><small>Unallocated income</small><strong>${money(totals().income-assigned)}</strong></div></div></section><section class="panel"><div class="panel-head"><h3>Upcoming dues & debts</h3><button class="link-btn" data-nav="recurring">Manage schedules</button></div>${due.length?due.map(r=>`<div class="feature-meta">• ${esc(r.name)} — ${money(r.amount)} — <span class="negative">${dateLabel(r.nextDue)}</span></div>`).join(''):'<p class="small muted">No overdue payments right now.</p>'}<p class="small muted" style="margin-top:12px">Net loans receivable: <b>${money(loans)}</b></p></section></div>`}


function handleAction(target){const action=target.dataset.action,itemId=target.dataset.id;switch(action){case'openTx':openTx({type:target.dataset.type||'expense',accountId:target.dataset.account||''});break;case'editTx':openTx({id:itemId});break;case'deleteTx':deleteTx(itemId);break;case'switchTx':getTxDraft();txDraft.type=target.dataset.type;renderTxModal();break;case'activateSplit':getTxDraft();txDraft.splits=[{categoryId:txDraft.categoryId,amount:txDraft.amount||''},{categoryId:data.categories.find(c=>c.id!==txDraft.categoryId)?.id||'',amount:''}];renderTxModal();break;case'disableSplit':getTxDraft();txDraft.categoryId=txDraft.splits[0]?.categoryId||txDraft.categoryId;txDraft.splits=[];renderTxModal();break;case'addSplit':getTxDraft();txDraft.splits.push({categoryId:'',amount:''});renderTxModal();break;case'removeSplit':getTxDraft();txDraft.splits.splice(Number(itemId),1);renderTxModal();break;case'closeModal':closeModal();break;case'setBudget':openBudget(itemId);break;case'copyBudget':copyBudget();break;case'setAllocation':openAllocation(itemId);break;case'copyAllocations':copyAllocations();break;case'openRecurring':openRecurringForm(itemId);break;case'toggleRecurring':toggleRecurring(itemId);break;case'payRecurring':payRecurring(itemId);break;case'skipRecurring':skipRecurring(itemId);break;case'deleteRecurring':deleteRecurring(itemId);break;case'openDebt':openDebtForm();break;case'payDebt':openDebtPayment(itemId);break;case'deleteDebt':deleteDebt(itemId);break;case'quick':openQuick();break;case'openAccount':openAccountForm();break;case'editAccount':openAccountForm(itemId);break;case'deleteAccount':deleteAccount(itemId);break;case'openGoal':openGoalForm();break;case'editGoal':openGoalForm(itemId);break;case'deleteGoal':deleteGoal(itemId);break;case'contribute':openTx({type:'transfer',goalId:itemId});break;case'withdrawGoal':openTx({type:'transfer',goalId:itemId,withdraw:true});break;case'openCategory':openCategoryForm();break;case'editCategory':openCategoryForm(itemId);break;case'deleteCategory':deleteCategory(itemId);break;case'exportJSON':exportJSON();break;case'downloadCSV':downloadCSV();break;case'demo':makeDemo();break;case'reset':resetData();break;default:break}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){actNav(nav.dataset.nav);return}const action=e.target.closest('[data-action]');if(action){handleAction(action);return}if(e.target.id==='modalLayer')closeModal()});
document.addEventListener('submit',e=>{if(!['txForm','budgetForm','accountForm','goalForm','categoryForm','allocationForm','recurringForm','debtForm','debtPayForm','quickForm'].includes(e.target.id))return;e.preventDefault();({txForm:saveTx,budgetForm:saveBudget,accountForm:saveAccount,goalForm:saveGoal,categoryForm:saveCategory,allocationForm:saveAllocation,recurringForm:saveRecurring,debtForm:saveDebt,debtPayForm:saveDebtPayment,quickForm:saveQuick}[e.target.id])()});
document.addEventListener('change',e=>{if(e.target.id==='periodPicker'){if(/^\d{4}-\d{2}$/.test(e.target.value)){selectedMonth=e.target.value;render()}}else if(e.target.id==='txType'){txFilters.type=e.target.value;render()}else if(e.target.id==='filterCategory'){txFilters.category=e.target.value;render()}else if(e.target.id==='filterAccount'){txFilters.account=e.target.value;render()}else if(e.target.id==='importFile'){importJSON(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='txSearch'){const start=e.target.selectionStart;txFilters.query=e.target.value;render();const n=document.getElementById('txSearch');n?.focus();try{n?.setSelectionRange(start,start)}catch(err){}}});
document.getElementById('menuBtn').addEventListener('click',toggleDrawer);document.getElementById('shade').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#modalLayer'))closeModal()});
// cloud.js Starts after login and loading the user’s data.
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>

<script src="./cloud.js"></script>
